name: Update Adventure Land data

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check remote data version (JSON only, no art)
        id: check
        run: |
          set +e
          npx ts-node scripts/check-al-data-version.ts
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" = "0" ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          elif [ "$code" = "10" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            exit "$code"
          fi

      - name: Read versions
        id: version
        if: steps.check.outputs.has_changes == 'true'
        run: |
          NEW=$(node -e "console.log(JSON.parse(require('fs').readFileSync('./public/data.json','utf8')).version)")
          OLD=$(node -e "console.log(JSON.parse(require('fs').readFileSync('./public/data.json.before','utf8')).version)")
          echo "new_version=$NEW" >> "$GITHUB_OUTPUT"
          echo "old_version=$OLD" >> "$GITHUB_OUTPUT"

      - name: Generate data diff body
        id: diff
        if: steps.check.outputs.has_changes == 'true'
        run: |
          BODY=$(npx ts-node scripts/summarize-data-diff.ts public/data.json.before public/data.json)
          {
            echo "body<<EOF"
            echo "$BODY"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # Org policy blocks Actions from opening PRs; commit to main directly.
      - name: Commit data update to main
        if: steps.check.outputs.has_changes == 'true'
        env:
          NEW_VERSION: ${{ steps.version.outputs.new_version }}
          DIFF_BODY: ${{ steps.diff.outputs.body }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data.json
          {
            echo "🗃️ Update data.json to v${NEW_VERSION}"
            echo
            echo "$DIFF_BODY"
          } > /tmp/commit-msg.txt
          git commit -F /tmp/commit-msg.txt
          git push origin HEAD:main

      - name: Trigger Pages deploy
        if: steps.check.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # GITHUB_TOKEN pushes do not fire on:push; dispatch deploy explicitly.
          gh workflow run deploy-pages.yml --ref main
