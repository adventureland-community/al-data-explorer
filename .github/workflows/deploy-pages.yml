name: Deploy static site to Pages

# Deploy only from trusted main-branch pushes — never on pull_request.
# PR validation lives in ci.yml (read-only, no secrets).
on:
  push:
    branches:
      - main
  workflow_dispatch: # Allow Manually run

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: CI=true npm test -- --watchAll=false

      - name: Update data.json and art assets
        run: npx ts-node update-data.ts

      - name: Build project
        env:
          DISABLE_ESLINT_PLUGIN: "true"
        run: npm run build

      - name: Create CNAME file
        run: echo "aldata.adventureland.community" > build/CNAME

      - name: Create 404.html to make SPA work
        run: cp build/index.html build/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./build

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
